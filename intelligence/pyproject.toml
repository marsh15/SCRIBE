[project]
name = "scribe-intel"
version = "0.1.0"
description = "Scribe 2.0 intelligence service (FastAPI, runs as a Vercel Python function)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "PyJWT>=2.9",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pydantic>=2.6",
  "httpx>=0.28.1",
  "tiktoken>=0.14.0",
]

[project.scripts]
scribe-eval = "scribe_eval.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "uvicorn>=0.32",
  "hypothesis>=6.168.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_intel", "src/scribe_eval", "src/scribe_ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
