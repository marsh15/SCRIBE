<text x="520" y="88" font-size="12.5" fill="#343a40">chat stream, legacy embeddings</text>
<rect x="156" y="625" width="529.4" height="18" fill="#ffffff" opacity="0.92"/>
<text x="160" y="638" font-size="12.5" fill="#343a40">direct upload with a client token; Blob then calls /api/sources/upload-complete</text>
<rect x="1156" y="395" width="27.799999999999997" height="18" fill="#ffffff" opacity="0.92"/>
<text x="1160" y="408" font-size="12.5" fill="#343a40">SQL</text>
<line x1="20" y1="700" x2="1280" y2="700" stroke="#ced4da"/>
<text x="20" y="726" font-size="13.5" fill="#343a40">Query: Next.js authenticates (Clerk), resolves the workspace, mints a 60 s token and calls POST /api/py/retrieve. Python runs one REPEATABLE READ</text>
<text x="20" y="748" font-size="13.5" fill="#343a40">transaction: dense + lexical search, RRF (k=60), Voyage rerank, dedup, parent expansion, 6,000-token packing, answerability gate, [E#] evidence bundle.</text>
<text x="20" y="770" font-size="13.5" fill="#343a40">Ingest: upload to Blob, then leased resumable steps PARSE, OCR, CHUNK, EMBED, ACTIVATE, driven by a self-firing tick route (Cron is the daily safety net).</text>
<text x="20" y="792" font-size="13.5" fill="#343a40">Dashed arrows: optional or outside the request path. Razorpay is off unless FEATURE_BILLING_ENABLED; Supermemory applies to the legacy engine only.</text>
<text x="20" y="814" font-size="13.5" fill="#343a40">scribe-eval / scribe-perf and the CI retrieval gate run locally or in GitHub Actions, never on Vercel, against a separate database and the same providers.</text>
</g></svg>
